namespace: 5g-core
releaseName: 5g-core

images:
  open5gs:
    repository: registry.local:5000/ocudu/open5gs-5gc
    tag: v2.7.6-kube
    pullPolicy: IfNotPresent
  telegraf:
    repository: registry.local:5000/ocudu/telegraf
    tag: 1.35.0-kube
    pullPolicy: IfNotPresent
  grafana:
    repository: registry.local:5000/ocudu/grafana
    tag: 12.0.2-kube
    pullPolicy: IfNotPresent
  influxdb:
    repository: influxdb
    tag: 3.1.0-core
    pullPolicy: IfNotPresent

open5gs:
  loadBalancerIP: 192.168.50.245
  upfAdvertiseIP: 192.168.50.245
  externalTrafficPolicy: Local

metrics:
  wsUrl: 192.168.50.38:8001
  gnbId: gnb0

influxdb:
  externalUrl: http://influxdb.5g-core.svc.cluster.local:8081
  storage:
    size: 10Gi
    storageClassName: ""

grafana:
  service:
    type: ClusterIP
  storage:
    size: 2Gi
    storageClassName: ""
